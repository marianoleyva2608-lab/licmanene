<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>Agenda tu Asesoría - Lic Manene</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=1713123456"></script>
    
    <!-- FullCalendar SDK -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js?v=1713123456"></script>

    <!-- Mercado Pago SDK -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <style>
        :root {
            --accent: #d4af37;
            --bg: #0c0b0a;
            --surface: #1a1a1a;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .checkout-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .header h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            background: linear-gradient(to bottom, #fff5d1, #accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--accent);
        }
        .price {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }
        
        /* Calendario Personalizado */
        #calendar-container {
            background: #222;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .fc { color: white; font-size: 0.85rem; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid rgba(255,255,255,0.07); }
        .fc-button-primary { background-color: var(--accent) !important; border: none !important; color: #000 !important; font-weight: 700 !important; border-radius: 8px !important; }
        .fc-button-primary:hover { opacity: 0.85 !important; }
        .fc-event { cursor: not-allowed; opacity: 0.9; border-radius: 6px !important; }
        .fc-timegrid-slot { height: 3.5em !important; }
        .fc-timegrid-col { background: #1c1c1c !important; }
        .fc-timegrid-col.fc-day-today { background: rgba(212,175,55,0.06) !important; }
        .fc-col-header-cell { background: #111 !important; }
        .fc-timegrid-slot-lane:hover { background: rgba(212,175,55,0.12) !important; cursor: pointer; }
        .fc-toolbar-title { color: var(--accent) !important; font-weight: 700; }
        .fc-col-header-cell-cushion { color: var(--accent) !important; text-decoration: none !important; font-weight: 600; }
        .fc-timegrid-slot-label-cushion { color: #ccc !important; font-size: 0.78rem; }
        .fc-scrollgrid { border-radius: 8px; overflow: hidden; }

        .tip-horario {
            text-align: center;
            color: #aaa;
            font-size: 0.78rem;
            margin-bottom: 10px;
            padding: 6px 10px;
            background: rgba(212,175,55,0.07);
            border-radius: 8px;
            border: 1px solid rgba(212,175,55,0.2);
        }

        .fc-scroller { -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
        .fc-scroller-harness { overflow: visible; }

        @media (max-width: 768px) {
            body { padding: 0; align-items: flex-start; background: #111; }
            .checkout-container {
                max-width: 100%;
                border-radius: 0;
                padding: 16px 12px;
                border: none;
                box-shadow: none;
                min-height: 100vh;
            }
            #calendar-container {
                padding: 6px;
                border-radius: 10px;
                min-height: 400px;
            }
            .fc { font-size: 0.8rem; }
            .fc-timegrid-slot { height: 3.5em !important; }
            .fc-timegrid-slot-label-cushion { font-size: 0.7rem !important; }
            .fc-button { padding: 7px 12px !important; font-size: 0.78rem !important; }
            .fc-toolbar-title { font-size: 0.95rem !important; }
            .header h2 { font-size: 1.2rem; }
            .price { font-size: 1.8rem; }
            .fc-event-title { font-size: 0.78rem; font-weight: 700; }
            .fc-event-main { padding: 4px 6px !important; }
        }
        
        .selected-slot-info {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
            color: var(--accent);
            font-weight: 600;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #aaa; }
        .form-group input {
            width: 100%; padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: white; outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }

        #wallet_container { margin-top: 15px; }
        .btn-pagar {
            width: 100%; padding: 14px;
            background: var(--accent); color: #000;
            border: none; border-radius: 10px;
            font-weight: 700; font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer; margin-top: 10px;
        }
        .btn-pagar:hover { opacity: 0.9; }
        .btn-pagar:disabled { opacity: 0.6; cursor: not-allowed; }
        .estado-pago-texto { color: #aaa; font-size: 0.85rem; margin-top: 15px; text-align: center; }
        .secure-badge { margin-top: 20px; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header">
            <h2>Agenda tu Asesoría</h2>
            <p>1. Selecciona horario | 2. Paga tu cita</p>
            <div class="price">$900.00 MXN</div>
        </div>

        <div class="tip-horario">
            <i class="fas fa-hand-pointer"></i> Toca un horario disponible para seleccionarlo
        </div>
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>

        <div id="selected-info" class="selected-slot-info">
            <i class="fas fa-calendar-check"></i> Horario seleccionado: <span id="display-date"></span>
        </div>

        <div class="form-group">
            <label>Tu Nombre Completo</label>
            <input type="text" id="cust-name" placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label>WhatsApp / Teléfono</label>
            <input type="text" id="cust-phone" placeholder="Ej. 5512345678">
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="cust-email" placeholder="Ej. juan@correo.com" required>
        </div>

        <p id="estado-pago" class="estado-pago-texto">Completa tu horario y tus datos para ver el botón de pago.</p>
        <div id="wallet_container"></div>

        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Pago seguro y sincronización inmediata
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxCPekI-5VEiiqKItQWh0diLWQwU6COVe-jXOr55Y1qUL5Kkcs9JPDkB8lOvRFgklDbQ/exec";
        const SUPABASE_URL = "https://licmanene-supabase.vms1bk.easypanel.host";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedDateTime = null;

        // Inicializar Calendario Propio
        document.addEventListener('DOMContentLoaded', async function() {
            const calendarEl = document.getElementById('calendar');
            const ahora = new Date();
            const scrollTime = '17:00:00';

            // Sombrear días/slots pasados con overlay de fondo (sin texto por slot)
            const pasados = [];
            const hace2Semanas = new Date(ahora);
            hace2Semanas.setDate(ahora.getDate() - 14);
            hace2Semanas.setHours(0, 0, 0, 0);
            for (let d = new Date(hace2Semanas); d <= ahora; d.setDate(d.getDate() + 1)) {
                if (d.getDay() === 0 || d.getDay() === 6) continue;
                const diaInicio = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 17, 0);
                const diaFin    = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 21, 10);
                const corte     = diaFin < ahora ? diaFin : ahora;
                if (diaInicio < corte) {
                    pasados.push({
                        start: diaInicio.toISOString(),
                        end:   corte.toISOString(),
                        display: 'background',
                        backgroundColor: 'rgba(0,0,0,0.45)',
                        classNames: ['slot-pasado']
                    });
                }
            }

            // Cargar citas ocupadas desde Supabase (solo futuras)
            let ocupados = [];
            try {
                const { data } = await _supabase.from('citas').select('cliente, fecha_cita');
                if (data) {
                    ocupados = data
                        .filter(c => new Date(c.fecha_cita) > ahora)
                        .map(c => ({
                            title: c.cliente.toUpperCase().includes('BLOQUEADO') ? 'No disponible' : 'Cita con Lic Manene',
                            start: c.fecha_cita,
                            end: new Date(new Date(c.fecha_cita).getTime() + 50 * 60 * 1000).toISOString(),
                            backgroundColor: c.cliente.toUpperCase().includes('BLOQUEADO') ? '#555' : '#b08020',
                            borderColor: 'transparent',
                            textColor: '#fff',
                            display: 'block'
                        }));
                }
            } catch (e) { console.error("Error cargando ocupados:", e); }

            const isMobile = window.innerWidth < 768;
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                initialDate: new Date(),
                locale: 'es',
                nowIndicator: true,
                scrollTime: scrollTime,
                slotMinTime: '17:00:00',
                slotMaxTime: '21:10:00',
                slotDuration: '00:50:00',
                slotLabelInterval: '00:50:00',
                snapDuration: '00:50:00',
                slotLabelFormat: { hour: 'numeric', minute: '2-digit', hour12: true },
                weekends: false,
                contentHeight: 'auto',
                dayHeaderFormat: isMobile
                    ? { weekday: 'short', day: 'numeric', omitCommas: true }
                    : { weekday: 'short', month: 'numeric', day: 'numeric', omitCommas: true },
                allDaySlot: false,
                selectable: true,
                headerToolbar: isMobile
                    ? { left: 'prev,next', center: 'title', right: 'today' }
                    : { left: 'prev,next today', center: 'title', right: 'timeGridWeek,timeGridDay' },
                events: [...pasados, ...ocupados],
                dateClick: function(info) {
                    // Validar si la hora está en el futuro
                    if (info.date < new Date()) {
                        alert("Por favor selecciona una fecha futura.");
                        return;
                    }
                    // Validar rango de horario (5 PM - 8:20 PM máximo inicio)
                    const h = info.date.getHours();
                    const m = info.date.getMinutes();
                    const minutosDesde5pm = (h - 17) * 60 + m;
                    if (h < 17 || minutosDesde5pm > 200) {
                        alert("Los horarios disponibles son de 5:00 PM a 8:20 PM.");
                        return;
                    }

                    // Validar que el slot no esté ya ocupado
                    const slotFin = new Date(info.date.getTime() + 50 * 60 * 1000);
                    const conflicto = calendar.getEvents().some(ev => {
                        if (ev.display === 'background') return false;
                        return info.date < ev.end && slotFin > ev.start;
                    });
                    if (conflicto) {
                        alert("Este horario ya está ocupado. Por favor selecciona otro disponible.");
                        return;
                    }

                    // Guardar selección
                    selectedDateTime = info.date;
                    const end = new Date(selectedDateTime.getTime() + (50 * 60 * 1000));
                    
                    const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
                    const rangeText = `${selectedDateTime.toLocaleDateString()} | ${selectedDateTime.toLocaleTimeString([], timeOptions)} a ${end.toLocaleTimeString([], timeOptions)}`;
                    
                    document.getElementById('display-date').innerText = rangeText;
                    document.getElementById('selected-info').style.display = 'block';

                    // Scroll suave hacia abajo
                    document.getElementById('selected-info').scrollIntoView({ behavior: 'smooth' });

                    programarGeneracionPago();
                }
            });
            calendar.render();
        });

        // Configurar Mercado Pago
        // Reemplaza con tu Public Key (panel de Mercado Pago -> Credenciales)
        const MP_PUBLIC_KEY = "APP_USR-c2d42e7c-974c-4ba7-9435-77cfdb7d1292";

        let mp = null;
        let walletController = null;
        let generandoPago = false;
        let ultimaClaveGenerada = '';
        let debounceTimer = null;

        const estadoPago = document.getElementById('estado-pago');
        const inputNombre = document.getElementById('cust-name');
        const inputTelefono = document.getElementById('cust-phone');
        const inputCorreo = document.getElementById('cust-email');

        const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        function datosListos() {
            return !!selectedDateTime && !!inputNombre.value.trim() && !!inputTelefono.value.trim() && EMAIL_REGEX.test(inputCorreo.value.trim());
        }

        function programarGeneracionPago() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(generarBotonPago, 600);
        }

        async function generarBotonPago() {
            if (!datosListos() || generandoPago) return;

            const nombre = inputNombre.value.trim();
            const contacto = inputTelefono.value.trim();
            const correo = document.getElementById('cust-email').value.trim();
            const clave = nombre + '|' + contacto + '|' + correo + '|' + selectedDateTime.toISOString();

            if (clave === ultimaClaveGenerada) return; // ya se generó para estos mismos datos
            ultimaClaveGenerada = clave;

            generandoPago = true;
            estadoPago.textContent = 'Generando botón de pago...';

            try {
                const resp = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        accion: 'crear_preferencia_mp',
                        cliente: nombre,
                        contacto: contacto,
                        correo: correo,
                        fecha: selectedDateTime.toISOString(),
                        baseUrl: window.location.origin
                    })
                });
                const resultado = await resp.json();
                if (!resultado.success) throw new Error(resultado.error || 'No se pudo generar el pago.');

                estadoPago.style.display = 'none';

                if (!mp) mp = new MercadoPago(MP_PUBLIC_KEY, { locale: 'es-MX' });
                if (walletController) await walletController.unmount();
                walletController = await mp.bricks().create('wallet', 'wallet_container', {
                    initialization: { preferenceId: resultado.preferenceId, redirectMode: 'self' }
                });
            } catch (e) {
                console.error("Error generando el pago:", e);
                estadoPago.style.display = 'block';

                if (/disponible/i.test(e.message || '')) {
                    // Otra persona reservó este horario mientras se llenaba el formulario:
                    // obligar a elegir otro en vez de reintentar el mismo horario.
                    estadoPago.textContent = 'Ese horario acaba de ser reservado por otra persona. Por favor selecciona otro horario disponible.';
                    selectedDateTime = null;
                    document.getElementById('selected-info').style.display = 'none';
                } else {
                    estadoPago.textContent = 'No se pudo generar el botón de pago. Intenta de nuevo en unos segundos.';
                }
                ultimaClaveGenerada = ''; // permitir reintentar con los mismos datos
            } finally {
                generandoPago = false;
            }
        }

        inputNombre.addEventListener('input', programarGeneracionPago);
        inputTelefono.addEventListener('input', programarGeneracionPago);
        inputCorreo.addEventListener('input', programarGeneracionPago);
    </script>
</body>
</html>
