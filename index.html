<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesoría Legal - Lic Manene</title>
    <!-- Importing elegant serif fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- FontAwesome for the Calendar icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Playfair Display', serif;
            background-color: #050505;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 700px;
            background-color: #0c0b0a;
            background-image: url('bg-original.jpg');
            background-size: auto 100%;
            background-position: 70% center; 
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center; /* Centrar el contenido completo en pantallas anchas */
            overflow: hidden;
        }

        /* Gradient overlay strictly for text readability on the left */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0c0b0a 0%, rgba(12, 11, 10, 0.8) 35%, transparent 70%);
            z-index: 1;
        }

        .hero-container {
            width: 100%;
            max-width: 1300px; /* Limita cuánto se separa el texto hacia la izquierda */
            position: relative;
            z-index: 2;
            padding: 0 40px;
        }

        .content-box {
            max-width: 600px;
        }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: 4.8rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: 0px; /* Letras menos alejadas */
            font-weight: 600;
            /* True Gold Metallic Gradient */
            background: linear-gradient(to bottom, #fff5d1 0%, #d4af37 40%, #c59b27 70%, #fff5d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }

        .subheading {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            color: #f8f8f8;
            font-weight: 300;
            max-width: 90%;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.9);
        }

        .cta-container {
            display: inline-block;
            /* Glowing subtle shadow for the outer frame of the button */
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 40px;
            /* Gradient matching the high-end metallic pill */
            background: linear-gradient(180deg, #fad373 0%, #cd9f2c 60%, #a47614 100%);
            border: 2px solid #ffeba1; /* Thin shiny border */
            border-radius: 50px;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0px -2px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #fce19a 0%, #ddb242 60%, #b88a20 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0px -2px 6px rgba(0,0,0,0.3), 0 5px 15px rgba(212, 175, 55, 0.5);
        }

        .cta-button i {
            margin-right: 12px;
            font-size: 1.2rem;
            color: #1a1a1a;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero-section {
                background-position: right 15%;
            }
            .headline {
                font-size: 3.8rem;
            }
        }

        @media (max-width: 600px) {
            .hero-section {
                padding-left: 5%;
                padding-right: 5%;
                text-align: center;
                background-position: center top; 
            }
            .overlay {
                width: 100%;
                background: linear-gradient(to bottom, rgba(5, 5, 5, 0.6) 0%, rgba(5, 5, 5, 0.95) 70%);
            }
            .content-box {
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: auto; /* Push text to bottom on mobile */
                padding-bottom: 10%;
            }
            .headline {
                font-size: 2.8rem;
            }
            .subheading {
                font-size: 1rem;
            }
            .cta-button {
                padding: 12px 30px;
            }
        }

        /* --- Estilos para la Modal de Google Calendar --- */
        .modal-overlay {
            display: none; /* Oculto por defecto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            animation: modalFadeIn 0.3s ease;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f1f1f1;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-size: 1.2rem;
            color: #333;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e2e2e2;
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            padding-top: 40px; /* space for the close button */
            background-color: white;
        }
    </style>
</head>
<body>
    <section class="hero-section">
        <div class="overlay"></div>
        <div class="hero-container">
            <div class="content-box">
                <h1 class="headline">
                    AGENDA TU<br>
                    ASESORÍA<br>
                    LEGAL<br>
                    EN LÍNEA
                </h1>
                <p class="subheading">
                    Haz tu cita en segundos para recibir<br>
                    asesoría con el Lic Manene.
                </p>
                <div class="cta-container">
                    <button id="btn-agendar" class="cta-button">
                        <i class="far fa-calendar-alt"></i> AGENDA AHORA
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Ventana Modal para Google Calendar -->
    <div id="calendar-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="btn-cerrar-modal"><i class="fas fa-times"></i></button>
            <div class="iframe-container">
                <!-- Por defecto no cargamos nada hasta que pongas el link publico de citas de Google Calendar aquí -->
                <iframe id="calendar-iframe" src="" style="border: 0" width="100%" height="600" frameborder="0" scrolling="yes"></iframe>
            </div>
        </div>
    </div>

    <script>
        const btnAgendar = document.getElementById('btn-agendar');
        const modal = document.getElementById('calendar-modal');
        const btnCerrar = document.getElementById('btn-cerrar-modal');
        const iframe = document.getElementById('calendar-iframe');

        // ==== AQUÍ DEBES PONER TU LINK PÚBLICO DE GOOGLE CALENDAR ====
        // Ejemplo: https://calendar.app.google/xxxxxxxxxxxxxxxxxx
        const GOOGLE_CALENDAR_LINK = "https://calendar.google.com/calendar/appointments/schedules/AcZssZ0placeholderxyz..."; 

        btnAgendar.addEventListener('click', () => {
            if (iframe.src === "" || iframe.src === window.location.href) {
                iframe.src = GOOGLE_CALENDAR_LINK; // Carga el calendario solo cuando lo abran
            }
            modal.style.display = 'flex';
        });

        btnCerrar.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Cerrar al dar click fuera de la ventana
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
