<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesoría Legal - Lic Manene</title>
    <!-- Importing elegant serif fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <!-- FontAwesome for the Calendar icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Playfair Display', serif;
            background-color: #050505;
        }

        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 700px;
            background-color: #0c0b0a;
            background-image: url('lic-fondo-negro.png');
            background-size: auto 100%;
            background-position: 70% center; 
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center; /* Centrar el contenido completo en pantallas anchas */
            overflow: hidden;
        }

        /* Gradient overlay strictly for text readability on the left */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #0c0b0a 0%, rgba(12, 11, 10, 0.8) 35%, transparent 70%);
            z-index: 1;
        }

        .hero-container {
            width: 100%;
            max-width: 1300px; /* Limita cuánto se separa el texto hacia la izquierda */
            position: relative;
            z-index: 2;
            padding: 0 40px;
        }

        .content-box {
            max-width: 600px;
        }

        .headline {
            font-family: 'Playfair Display', serif;
            font-size: 4.8rem;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: 0px; /* Letras menos alejadas */
            font-weight: 600;
            /* True Gold Metallic Gradient */
            background: linear-gradient(to bottom, #fff5d1 0%, #d4af37 40%, #c59b27 70%, #fff5d1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.8));
        }

        .subheading {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            color: #f8f8f8;
            font-weight: 300;
            max-width: 90%;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.9);
        }

        .cta-container {
            display: inline-block;
            /* Glowing subtle shadow for the outer frame of the button */
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 40px;
            /* Gradient matching the high-end metallic pill */
            background: linear-gradient(180deg, #fad373 0%, #cd9f2c 60%, #a47614 100%);
            border: 2px solid #ffeba1; /* Thin shiny border */
            border-radius: 50px;
            color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 1px;
            text-decoration: none;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), inset 0px -2px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            background: linear-gradient(180deg, #fce19a 0%, #ddb242 60%, #b88a20 100%);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), inset 0px -2px 6px rgba(0,0,0,0.3), 0 5px 15px rgba(212, 175, 55, 0.5);
        }

        .cta-button i {
            margin-right: 12px;
            font-size: 1.2rem;
            color: #1a1a1a;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .hero-section {
                background-position: right 15%;
            }
            .headline {
                font-size: 3.8rem;
            }
        }

        @media (max-width: 600px) {
            .hero-section {
                padding-left: 5%;
                padding-right: 5%;
                text-align: center;
                background-position: center top; 
            }
            .overlay {
                width: 100%;
                background: linear-gradient(to bottom, rgba(5, 5, 5, 0.6) 0%, rgba(5, 5, 5, 0.95) 70%);
            }
            .content-box {
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: auto; /* Push text to bottom on mobile */
                padding-bottom: 10%;
            }
            .headline {
                font-size: 2.8rem;
            }
            .subheading {
                font-size: 1rem;
            }
            .cta-button {
                padding: 12px 30px;
            }
        }

    </style>
</head>
<body>
    <section class="hero-section">
        <div class="overlay"></div>
        <div class="hero-container">
            <div class="content-box">
                <h1 class="headline">
                    AGENDA TU<br>
                    ASESORÍA<br>
                    LEGAL<br>
                    EN LÍNEA
                </h1>
                <p class="subheading">
                    Haz tu cita en segundos para recibir<br>
                    asesoría con el Lic Manene.
                </p>
                <div class="cta-container">
                    <a id="btn-agendar" class="cta-button" target="_blank" href="#">
                        <i class="far fa-calendar-alt"></i> AGENDA AHORA
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- El modal ha sido removido por bloqueos de seguridad bancaria -->

    <script>
        const btnAgendar = document.getElementById('btn-agendar');

        // Modo de Pago Activo: PayPal Sandbox
        // Redirigimos a la pasarela de prueba de PayPal que acabamos de implementar
        btnAgendar.href = "paypal-checkout.html";
        
        // El link de Mercado Pago queda comentado por si se desea reactivar en el futuro
        // const MERCADO_PAGO_LINK = "https://mpago.la/xxxxxx"; 

        // Acceso Oculto al Panel de Citas: Multi-Tap (5 Toques) o Tap Largo de Seguridad
        const headline = document.querySelector('.headline');
        
        // 1. Deshabilitar selección de texto y menú contextual en el celular para que no estorben
        headline.style.userSelect = 'none';
        headline.style.webkitUserSelect = 'none';
        headline.style.webkitTouchCallout = 'none';
        headline.oncontextmenu = (e) => { e.preventDefault(); return false; };

        // 2. Lógica del Tap Largo (Reducido a 2 Segundos)
        let pressTimer;
        const startPress = () => {
            pressTimer = setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 2000); 
        };
        const cancelPress = () => clearTimeout(pressTimer);

        headline.addEventListener('touchstart', startPress, {passive: true});
        headline.addEventListener('touchend', cancelPress);
        headline.addEventListener('touchmove', cancelPress);
        headline.addEventListener('mousedown', startPress);
        headline.addEventListener('mouseup', cancelPress);
        headline.addEventListener('mouseleave', cancelPress);

        // 3. Lógica Alternativa: Dar 5 toques ultra-rápidos (Por si el Tap Largo sigue fallando)
        let contToques = 0;
        let limpiarTap;
        headline.addEventListener('click', (e) => {
            contToques++;
            if (contToques === 5) {
                window.location.href = 'dashboard.html';
            }
            clearTimeout(limpiarTap);
            limpiarTap = setTimeout(() => { contToques = 0; }, 1200); // 1.2s para completarlos
        });
    </script>
</body>
</html>
