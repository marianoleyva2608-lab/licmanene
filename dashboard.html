<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>Panel de Citas - Lic Manene (v2.0.1)</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- FullCalendar SDK -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>

    <!-- Google Calendar API -->
    <script src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
    <script src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
    
    <style>
        :root {
            --accent: #d4af37;
            --bg: #0c0b0a;
            --surface: #1a1a1a;
        }
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg); 
            color: #f8f8f8; 
            margin: 0; 
            padding: 20px; 
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid var(--accent); 
            padding-bottom: 15px; 
            margin-bottom: 25px; 
        }
        .header h1 { 
            color: var(--accent); 
            margin: 0; 
            font-size: 1.8rem;
        }
        /* Botones dorados modernos */
        .btn { 
            background: linear-gradient(180deg, #fad373 0%, #cd9f2c 60%, #a47614 100%);
            color: #1a1a1a; 
            padding: 10px 20px; 
            border: 2px solid #ffeba1; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600; 
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.6), 0 2px 5px rgba(0,0,0,0.5);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.8), 0 5px 15px rgba(212, 175, 55, 0.5);
        }

        /* Tabla oscura premium */
        .table-container {
            overflow-x: auto;
        }
        table { 
            width: 100%; 
            border-collapse: collapse; 
            background: var(--surface); 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        th, td { 
            padding: 18px; 
            text-align: left; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
        }
        th { 
            background: rgba(212, 175, 55, 0.1); 
            color: var(--accent); 
            font-weight: 600; 
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.9rem;
        }
        tr:hover { background: rgba(255,255,255,0.03); }
        tr:last-child td { border-bottom: none; }
        
        .badge { 
            background: #34d399; 
            color: #064e3b; 
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            font-weight: 700; 
        }

        /* Modal para Bloqueos */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.85); 
            justify-content: center; 
            align-items: center; 
            z-index: 100;
        }
        .modal-content { 
            background: var(--surface); 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid var(--accent); 
            width: 95%; 
            max-width: 800px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            max-height: 90vh;
            overflow-y: auto;
        }
        #block-calendar {
            background: #111;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 500px;
            color: white;
        }
        .fc { font-size: 0.85rem; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid rgba(255,255,255,0.05); }
        .fc-button-primary { background-color: var(--accent) !important; border: none !important; color: black !important; font-weight: 600 !important; }
        .fc-daygrid-day-number, .fc-col-header-cell-cushion { color: #ccc; text-decoration: none; }
        .fc-list-day-text, .fc-list-day-side-text { color: var(--accent); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 0.9rem; }
        .form-group input { 
            width: 100%; 
            padding: 12px; 
            background: #111; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 8px; 
            outline: none;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-gavel"></i> Panel de Control</h1>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button id="btn-conectar-calendar" class="btn" style="display:none; background: #fff; color: #333; border-color: #ddd;" onclick="conectarCalendar()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="height:16px; vertical-align:middle; margin-right:6px;">Conectar Google Calendar
            </button>
            <span id="calendar-status" style="display:none; color:#34d399; font-size:0.8rem; align-self:center;">✅ Google Calendar conectado</span>
            <button class="btn" onclick="abrirModalBloqueo()">🚫 Bloquear Horario</button>
            <button class="btn" style="background: transparent; color: var(--accent); border-color: var(--accent); box-shadow: none;" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Contacto (WhatsApp)</th>
                    <th>Fecha y Hora de la Cita</th>
                    <th>ID de Pago</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-citas">
                <tr><td colspan="5" style="text-align: center; color: #888;">Cargando citas...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Modal para bloquear horarios -->
    <div id="bloqueo-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent); margin-top: 0;"><i class="fas fa-lock"></i> Agendar / Bloquear Espacio</h2>
            <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 20px;">
                Selecciona un horario en el calendario e ingresa los datos del cliente.
            </p>
            <div id="block-calendar"></div>
            <div id="selected-info" style="margin-top: 15px; color: var(--accent); font-weight: 600; display: none;">
                <i class="fas fa-clock"></i> Horario seleccionado: <span id="display-fecha"></span>
            </div>
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Nombre del cliente</label>
                    <input type="text" id="bloqueo-nombre" placeholder="Ej. Juan Pérez (o dejar vacío para bloquear)">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Teléfono / WhatsApp</label>
                    <input type="text" id="bloqueo-telefono" placeholder="Ej. 5512345678">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Correo electrónico</label>
                    <input type="email" id="bloqueo-correo" placeholder="Ej. cliente@correo.com">
                </div>
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn" style="background: #333; color: white; border-color: #555; box-shadow: none;" onclick="document.getElementById('bloqueo-modal').style.display='none'">Cancelar</button>
                <button id="btn-confirmar-bloqueo" class="btn" style="opacity: 0.5; pointer-events: none;" onclick="confirmarBloqueo()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://agent-supabase.c4o2yg.easypanel.host";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE";
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyj9W1VZj94Fm1KcqTxi8aPpfeqciWLgQOIRDPUS09-b2VwRoDRdRNishz5SVhEofnN/exec";

        // Google Calendar API
        const GOOGLE_CLIENT_ID = "632910100889-1qqj82379872220tt8sqs9e9ioj49snc.apps.googleusercontent.com";
        const GOOGLE_SCOPES = "https://www.googleapis.com/auth/calendar";
        let tokenClient;
        let gapiInited = false;
        let gisInited = false;

        function gapiLoaded() {
            gapi.load('client', async () => {
                await gapi.client.init({
                    discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
                });
                gapiInited = true;
                habilitarBotonCalendar();
            });
        }

        function gisLoaded() {
            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: GOOGLE_SCOPES,
                callback: async (resp) => {
                    if (resp.error) { console.error(resp); return; }
                    document.getElementById('btn-conectar-calendar').style.display = 'none';
                    document.getElementById('calendar-status').style.display = 'inline';
                    if (blockCalendar) {
                        blockCalendar.refetchEvents();
                    }
                },
            });
            gisInited = true;
            habilitarBotonCalendar();
        }

        function habilitarBotonCalendar() {
            if (gapiInited && gisInited) {
                document.getElementById('btn-conectar-calendar').style.display = 'inline-flex';
                document.getElementById('btn-conectar-calendar').style.alignItems = 'center';
            }
        }

        function conectarCalendar() {
            if (gapi.client.getToken() === null) {
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } else {
                tokenClient.requestAccessToken({ prompt: '' });
            }
        }

        function cerrarSesion() {
            const token = gapi.client.getToken();
            if (token) {
                google.accounts.oauth2.revoke(token.access_token);
                gapi.client.setToken('');
            }
            window.location.href = 'index.html';
        }

        async function obtenerEventosCalendar(fetchInfo, successCallback, failureCallback) {
            if (!gapi.client.getToken()) {
                successCallback([]);
                return;
            }
            try {
                const resp = await gapi.client.calendar.events.list({
                    calendarId: 'primary',
                    timeMin: fetchInfo.startStr,
                    timeMax: fetchInfo.endStr,
                    singleEvents: true,
                    orderBy: 'startTime',
                });
                const eventos = (resp.result.items || []).map(ev => ({
                    id: ev.id,
                    title: ev.summary || 'Sin título',
                    start: ev.start.dateTime || ev.start.date,
                    end: ev.end.dateTime || ev.end.date,
                    backgroundColor: (ev.summary || '').includes('BLOQUEADO') ? '#4b4b4b' : '#d4af37',
                    borderColor: 'transparent',
                    textColor: '#000',
                }));
                successCallback(eventos);
            } catch (e) {
                failureCallback(e);
            }
        }

        async function crearEventoCalendar(titulo, inicio, descripcion) {
            if (!gapi.client.getToken()) return null;
            const fin = new Date(new Date(inicio).getTime() + 50 * 60 * 1000).toISOString();
            const resp = await gapi.client.calendar.events.insert({
                calendarId: 'primary',
                resource: {
                    summary: titulo,
                    description: descripcion,
                    start: { dateTime: inicio, timeZone: 'America/Mexico_City' },
                    end: { dateTime: fin, timeZone: 'America/Mexico_City' },
                },
            });
            return resp.result.id;
        }
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let blockCalendar = null;
        let selectedBlockDate = null;

        async function cargarCitas() {
            const tbody = document.getElementById('tabla-citas');
            try {
                const { data, error } = await _supabase
                    .from('citas')
                    .select('*')
                    .order('fecha_cita', { ascending: false });
                
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #888;">No hay registros disponibles.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(cita => {
                    const fechaObj = new Date(cita.fecha_cita);
                    const fechaFormat = fechaObj.toLocaleDateString('es-MX', {day: '2-digit', month: 'short', year: 'numeric'}) 
                                      + ' | ' + fechaObj.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', hour12: true });
                    
                    const isBloqueo = cita.cliente.toUpperCase().includes("BLOQUEADO");
                    
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td style="font-weight: 600; color: ${isBloqueo ? '#ef4444' : '#fff'};">
                            ${isBloqueo ? '<i class="fas fa-ban"></i> BLOQUEADO' : cita.cliente}
                        </td>
                        <td style="color: #bbb;">${isBloqueo ? '-' : cita.contacto}</td>
                        <td style="color: var(--accent);">${fechaFormat}</td>
                        <td style="color: #666; font-family: monospace;">${cita.paypal_order_id}</td>
                        <td>
                            <span class="badge" style="background: ${isBloqueo ? '#ef4444' : '#d4af37'}; color: ${isBloqueo ? '#fff' : '#000'};">
                                ${isBloqueo ? 'No Disponible' : 'Cita Pagada'}
                            </span>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("Error cargando citas:", error);
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444;">Error al conectar con la base de datos Supabase.</td></tr>';
            }
        }

        function abrirModalBloqueo() {
            document.getElementById('bloqueo-modal').style.display = 'flex';
            document.getElementById('bloqueo-nombre').value = '';
            document.getElementById('bloqueo-telefono').value = '';
            document.getElementById('bloqueo-correo').value = '';
            document.getElementById('selected-info').style.display = 'none';
            document.getElementById('btn-confirmar-bloqueo').style.opacity = '0.5';
            document.getElementById('btn-confirmar-bloqueo').style.pointerEvents = 'none';
            selectedBlockDate = null;
            
            if (!blockCalendar) {
                const calendarEl = document.getElementById('block-calendar');
                const ahoraB = new Date();
                const scrollHB = Math.min(19, Math.max(8, ahoraB.getHours() - 1));
                const scrollTimeB = `${String(scrollHB).padStart(2, '0')}:00:00`;
                blockCalendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'timeGridWeek',
                    initialDate: new Date(),
                    locale: 'es',
                    nowIndicator: true,
                    scrollTime: scrollTimeB,
                    slotMinTime: '08:00:00',
                    slotMaxTime: '20:00:00',
                    slotDuration: '00:50:00',
                    allDaySlot: false,
                    selectable: true,
                    headerToolbar: { left: 'prev,next today', center: 'title', right: 'timeGridWeek,timeGridDay' },
                    events: gapi.client && gapi.client.getToken() ? obtenerEventosCalendar : GOOGLE_SCRIPT_URL,
                    dateClick: function(info) {
                        selectedBlockDate = info.date;
                        const display = document.getElementById('display-fecha');
                        display.innerText = selectedBlockDate.toLocaleString('es-MX', { 
                            weekday: 'long', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' 
                        });
                        document.getElementById('selected-info').style.display = 'block';
                        
                        const btn = document.getElementById('btn-confirmar-bloqueo');
                        btn.style.opacity = "1";
                        btn.style.pointerEvents = "auto";
                    }
                });
                blockCalendar.render();
            } else {
                blockCalendar.refetchEvents();
                setTimeout(() => { blockCalendar.render(); }, 200);
            }
        }

        async function confirmarBloqueo() {
            if(!selectedBlockDate) return;

            const nombre   = document.getElementById('bloqueo-nombre').value.trim();
            const telefono = document.getElementById('bloqueo-telefono').value.trim();
            const correo   = document.getElementById('bloqueo-correo').value.trim();

            const esBloqueo = !nombre;
            const cliente   = esBloqueo ? 'BLOQUEADO' : nombre;
            const contacto  = [telefono, correo].filter(Boolean).join(' | ') || '-';
            const isoString = selectedBlockDate.toISOString();

            document.getElementById('bloqueo-modal').style.display='none';

            try {
                // 1. Guardar en Supabase
                await _supabase.from('citas').insert([{
                    cliente: cliente,
                    fecha_cita: isoString,
                    contacto: contacto,
                    paypal_order_id: (esBloqueo ? 'BLOQUEO_MANUAL_' : 'ADMIN_') + Date.now(),
                    monto: 0
                }]);

                // 2. Sincronizar hacia Google Calendar
                const titulo = esBloqueo ? '🚫 BLOQUEADO' : `⚖️ Asesoría: ${cliente}`;
                const descripcion = esBloqueo
                    ? 'Horario bloqueado manualmente.'
                    : `Cliente: ${cliente}\nTeléfono: ${telefono}\nCorreo: ${correo}`;

                if (gapi.client && gapi.client.getToken()) {
                    await crearEventoCalendar(titulo, isoString, descripcion);
                } else {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: JSON.stringify({ cliente, contacto, fecha: isoString, pagoId: esBloqueo ? 'BLOQUEO_MANUAL' : 'ADMIN' })
                    });
                }

                alert("Horario bloqueado con éxito.");
                cargarCitas();
                if(blockCalendar) blockCalendar.refetchEvents();
            } catch(e) {
                alert("Ocurrió un error al intentar bloquear: " + e.message);
            }
        }

        // Ejecutar al cargar la página
        cargarCitas();
    </script>
</body>
</html>
