<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="no-cache, must-revalidate, post-check=0, pre-check=0">
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="no-cache">
    <title>Agenda tu Asesoría - Lic Manene</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2?v=1713123456"></script>
    
    <!-- FullCalendar SDK -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js?v=1713123456"></script>

    <!-- PayPal SDK (Sandbox Mode) -->
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=MXN"></script>
    
    <style>
        :root {
            --accent: #d4af37;
            --bg: #0c0b0a;
            --surface: #1a1a1a;
        }
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .checkout-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .header h2 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            background: linear-gradient(to bottom, #fff5d1, #accent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: var(--accent);
        }
        .price {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
        }
        
        /* Calendario Personalizado */
        #calendar-container {
            background: #222;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-height: 450px;
        }
        .fc { color: white; font-size: 0.85rem; }
        .fc-theme-standard td, .fc-theme-standard th { border: 1px solid rgba(255,255,255,0.05); }
        .fc-button-primary { background-color: var(--accent) !important; border: none !important; color: black !important; font-weight: 600 !important; }
        .fc-event { cursor: not-allowed; opacity: 0.7; }
        .fc-timegrid-slot { height: 3em !important; }
        
        .selected-slot-info {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: none;
            color: var(--accent);
            font-weight: 600;
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8rem; color: #aaa; }
        .form-group input {
            width: 100%; padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; color: white; outline: none;
        }
        .form-group input:focus { border-color: var(--accent); }

        #paypal-button-container { margin-top: 15px; }
        .secure-badge { margin-top: 20px; font-size: 0.75rem; color: #666; }
        
        #success-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.95); z-index: 1000;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #success-overlay i { font-size: 5rem; color: #34d399; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header">
            <h2>Agenda tu Asesoría</h2>
            <p>1. Selecciona horario | 2. Paga tu cita</p>
            <div class="price">$900.00 MXN</div>
        </div>

        <div id="calendar-container">
            <div id="calendar"></div>
        </div>

        <div id="selected-info" class="selected-slot-info">
            <i class="fas fa-calendar-check"></i> Horario seleccionado: <span id="display-date"></span>
        </div>

        <div class="form-group">
            <label>Tu Nombre Completo</label>
            <input type="text" id="cust-name" placeholder="Ej. Juan Pérez">
        </div>
        <div class="form-group">
            <label>WhatsApp / Teléfono</label>
            <input type="text" id="cust-phone" placeholder="Ej. 5512345678">
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="cust-email" placeholder="Ej. juan@correo.com">
        </div>

        <div id="paypal-button-container"></div>

        <!-- Botón de Prueba Técnica (Solo para validar conexión) -->
        <button onclick="simularPagoExitoso()" style="margin-top: 15px; background: #333; color: #888; border: 1px solid #444; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.7rem; width: 100%;">
            🧪 Simular Cita de Prueba (Bypass Pago)
        </button>

        <div class="secure-badge">
            <i class="fas fa-shield-alt"></i> Pago seguro y sincronización inmediata
        </div>
    </div>

    <div id="success-overlay">
        <i class="fas fa-check-circle"></i>
        <h2>¡Cita Confirmada!</h2>
        <p>Tu asesoría ha sido agendada con éxito.<br>Recibirás un correo con los detalles en breve.</p>
        <button class="btn" style="margin-top:20px; background:var(--accent); padding:10px 20px; border:none; border-radius:8px; cursor:pointer;" onclick="window.location.href='index.html'">Volver al Inicio</button>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbz6HS6Z-C8RaOqEwVrV0iX2xGT_Da7QQZla5n-a0l4A1E7AoDTlepQF17OcFIawXxCA/exec";
        const SUPABASE_URL = "https://agent-supabase.c4o2yg.easypanel.host";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE";
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedDateTime = null;

        // Inicializar Calendario Propio
        document.addEventListener('DOMContentLoaded', async function() {
            const calendarEl = document.getElementById('calendar');
            const ahora = new Date();
            const scrollH = Math.min(19, Math.max(8, ahora.getHours() - 1));
            const scrollTime = `${String(scrollH).padStart(2, '0')}:00:00`;

            // Cargar citas ocupadas desde Supabase
            let ocupados = [];
            try {
                const { data } = await _supabase.from('citas').select('cliente, fecha_cita');
                if (data) {
                    ocupados = data.map(c => ({
                        title: c.cliente === 'BLOQUEADO' ? '🚫 No disponible' : '⚖️ Ocupado',
                        start: c.fecha_cita,
                        end: new Date(new Date(c.fecha_cita).getTime() + 50 * 60 * 1000).toISOString(),
                        backgroundColor: c.cliente === 'BLOQUEADO' ? '#4b4b4b' : '#d4af37',
                        borderColor: 'transparent',
                        textColor: '#000',
                        display: 'block'
                    }));
                }
            } catch (e) { console.error("Error cargando ocupados:", e); }

            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'timeGridWeek',
                initialDate: new Date(),
                locale: 'es',
                nowIndicator: true,
                scrollTime: scrollTime,
                slotMinTime: '08:00:00',
                slotMaxTime: '20:00:00',
                slotDuration: '00:50:00',
                slotLabelInterval: '00:50:00',
                snapDuration: '00:50:00',
                allDaySlot: false,
                selectable: true,
                headerToolbar: { left: 'prev,next today', center: 'title', right: 'timeGridWeek,timeGridDay' },
                events: ocupados,
                dateClick: function(info) {
                    // Validar si la hora está en el futuro
                    if (info.date < new Date()) {
                        alert("Por favor selecciona una fecha futura.");
                        return;
                    }
                    
                    // Guardar selección
                    selectedDateTime = info.date;
                    const end = new Date(selectedDateTime.getTime() + (50 * 60 * 1000));
                    
                    const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
                    const rangeText = `${selectedDateTime.toLocaleDateString()} | ${selectedDateTime.toLocaleTimeString([], timeOptions)} a ${end.toLocaleTimeString([], timeOptions)}`;
                    
                    document.getElementById('display-date').innerText = rangeText;
                    document.getElementById('selected-info').style.display = 'block';
                    
                    // Scroll suave hacia abajo
                    document.getElementById('selected-info').scrollIntoView({ behavior: 'smooth' });
                }
            });
            calendar.render();
        });

        // Configurar PayPal
        paypal.Buttons({
            createOrder: function(data, actions) {
                if (!selectedDateTime) {
                    alert("Por favor, selecciona primero un horario en el calendario.");
                    return;
                }
                const nombre = document.getElementById('cust-name').value.trim();
                const contacto = document.getElementById('cust-phone').value.trim();
                if (!nombre) {
                    alert("Por favor ingresa tu nombre completo.");
                    document.getElementById('cust-name').focus();
                    return;
                }
                if (!contacto) {
                    alert("Por favor ingresa tu número de WhatsApp.");
                    document.getElementById('cust-phone').focus();
                    return;
                }
                return actions.order.create({
                    purchase_units: [{
                        description: "Asesoría Legal (Agendada: " + selectedDateTime.toLocaleString() + ")",
                        amount: { currency_code: "MXN", value: "900.00" }
                    }]
                });
            },
            onApprove: function(data, actions) {
                return actions.order.capture().then(async function(details) {
                    const nombre   = document.getElementById('cust-name').value.trim() || details.payer.name.given_name;
                    const contacto = document.getElementById('cust-phone').value.trim() || details.payer.email_address;
                    const correo   = document.getElementById('cust-email').value.trim() || details.payer.email_address;

                    try {
                        // 1. Guardar en Supabase
                        const { error: sbError } = await _supabase.from('citas').insert([{
                            cliente: nombre,
                            fecha_cita: selectedDateTime.toISOString(),
                            contacto: contacto,
                            paypal_order_id: data.orderID,
                            monto: 900
                        }]);
                        if (sbError) throw new Error("Supabase: " + sbError.message);

                        // 2. Enviar a Google Calendar + correo con Meet
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({
                                cliente: nombre,
                                contacto: contacto,
                                correo: correo,
                                fecha: selectedDateTime.toISOString(),
                                pagoId: data.orderID
                            })
                        });
                    } catch (e) {
                        console.error("Error en sincronización:", e);
                        alert("⚠️ Pago recibido pero hubo un error al guardar la cita:\n" + e.message);
                    }

                    document.getElementById('success-overlay').style.display = 'flex';
                });
            }
        }).render('#paypal-button-container');

        // FUNCIÓN DE PRUEBA TÉCNICA
        async function simularPagoExitoso() {
            if (!selectedDateTime) { alert("Elige un horario primero"); return; }
            const nombre   = document.getElementById('cust-name').value.trim();
            const contacto = document.getElementById('cust-phone').value.trim();
            const correo   = document.getElementById('cust-email').value.trim();
            if (!nombre)   { alert("Por favor ingresa tu nombre completo."); document.getElementById('cust-name').focus(); return; }
            if (!contacto) { alert("Por favor ingresa tu número de WhatsApp."); document.getElementById('cust-phone').focus(); return; }

            console.log("Iniciando simulación...");
            try {
                // 1. Supabase
                const { error: sbError } = await _supabase.from('citas').insert([{
                    cliente: nombre,
                    fecha_cita: selectedDateTime.toISOString(),
                    contacto: contacto,
                    paypal_order_id: 'MOCK_TEST_' + Date.now(),
                    monto: 900
                }]);
                if (sbError) throw new Error("Supabase: " + sbError.message);

                // 2. Google
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        cliente: nombre, contacto: contacto, correo: correo,
                        fecha: selectedDateTime.toISOString(), pagoId: 'MOCK_TEST'
                    })
                });

                document.getElementById('success-overlay').style.display = 'flex';
                alert("✅ Cita guardada exitosamente.");
            } catch (e) {
                alert("❌ Error al guardar la cita:\n" + e.message);
            }
        }
    </script>
</body>
</html>
